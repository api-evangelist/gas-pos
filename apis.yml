name: Gas POS
description: >-
  Gas Pos is a North Little Rock, Arkansas technology company (founded 2015) that
  builds cloud-based point-of-sale systems and EMV-certified fuel dispensers for gas
  stations and truck stops across the United States. Delivered as equipment-as-a-service
  with no upfront hardware cost, the platform pairs touchscreen POS terminals, barcode
  scanners, and back-office inventory and pricing tools with PCI-compliant, EMV-certified
  payment processing at both the register and the pump. It accepts major fleet cards
  including Comdata, Comchek, EFS, T-Chek, Voyager, and Fleetone, and lets operators
  manage item pricing and inventory remotely from a phone. Backed by 500 Global and
  Pioneer Fund. Added to the API Evangelist network as a company profile; no public
  developer API surface has been located to date.
